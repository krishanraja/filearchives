name: ci

# The checks that run off Krish's Windows PC. The tests that need a C: drive
# (see RESUME.md) still run on his machine only. Synthetic fixtures only;
# nothing here reads his drives. On main, the fold job also writes each
# closeout note into NOW.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 7.5 (the folder record needs ConvertFrom-Json -DateKind)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pwsh.tgz" https://github.com/PowerShell/PowerShell/releases/download/v7.5.2/powershell-7.5.2-linux-x64.tar.gz
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar xzf "$RUNNER_TEMP/pwsh.tgz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Stage contracts
        run: python3 tests/test_stage_contracts.py

      - name: Chat backstop hook (W3.3)
        run: python3 tests/test_taste_backstop.py

      - name: Stage conveyor
        run: |
          base=https://raw.githubusercontent.com/krishanraja/ai-harness/main/skills/krish-build
          mkdir -p "$RUNNER_TEMP/conveyor/scripts" "$RUNNER_TEMP/conveyor/references"
          curl -sSf -o "$RUNNER_TEMP/conveyor/scripts/check-stage-conveyor.mjs" "$base/scripts/check-stage-conveyor.mjs"
          curl -sSf -o "$RUNNER_TEMP/conveyor/references/stage-conveyor-manifest.schema.json" "$base/references/stage-conveyor-manifest.schema.json"
          node "$RUNNER_TEMP/conveyor/scripts/check-stage-conveyor.mjs" --root . --manifest pipeline/stage-conveyor.json

      - name: Krish's folders need his yes (must pass before any mover, planner or consent change)
        run: pwsh -NoLogo -NoProfile -File tests/test_new_folder_survives.ps1

      - name: A folder inside a declared engine folder is known without asking (I-25)
        run: pwsh -NoLogo -NoProfile -File tests/test_declared_folders.ps1

      - name: The check-in counts only true losses
        run: pwsh -NoLogo -NoProfile -File tests/test_checkin_true_losses.ps1

      - name: Dev sprawl report and consent-row moves
        run: pwsh -NoLogo -NoProfile -File tests/test_dev_sprawl.ps1

      - name: The cloud steward reconciles the Drive tree by key (I-25)
        run: pwsh -NoLogo -NoProfile -File tests/test_reconcile_drive_tree.ps1

      - name: Other portable engine tests
        run: |
          for t in test_repository_snapshot test_atomic_tree_relocation test_extension_move \
                   test_filtered_copy_manifest test_layout_classifier test_path_regex_quarantine \
                   test_sensitive_name_quarantine test_streaming_folder_copy \
                   test_temporary_family_consolidation test_verified_copy_sharding; do
            echo "== $t"
            pwsh -NoLogo -NoProfile -File "tests/$t.ps1"
          done

  fold:
    # A closeout note (now-notes/YYYY-MM-DD-<slug>.md) that reaches main is folded into NOW.md and removed, so
    # pull requests never edit NOW.md at once (Ruling, Krish, 2026-10-28) and NOW.md never goes stale behind
    # its notes (four waited on main on 2026-11-14, when nothing here folded them). The fold is ai-harness's own
    # closeout hook (`--fold`), read from its main at run time: this repository is not one the harness publisher
    # administers, so it keeps no copy of it. It runs on a push to main and by hand. Every attempt folds afresh
    # from the newest main, so the steward's daily commit or another fold landing first never leaves a conflicted
    # NOW.md. A push by this job starts no other workflow.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: closeout-fold
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krishanraja/ai-harness
          ref: main
          path: .harness
          sparse-checkout: .claude/hooks/harness-closeout.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fold closeout notes into NOW.md
        run: |
          set -uo pipefail
          hook="$RUNNER_TEMP/harness-closeout.mjs"
          cp .harness/.claude/hooks/harness-closeout.mjs "$hook" && rm -rf .harness
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME" && git reset --quiet --hard "origin/$GITHUB_REF_NAME" || exit 1
            if ! ls now-notes/*.md >/dev/null 2>&1; then echo "No closeout notes to fold."; exit 0; fi
            status=0; node "$hook" --fold || status=$?
            if [ -z "$(git status --porcelain -- NOW.md now-notes)" ]; then exit "$status"; fi
            git add -A -- NOW.md now-notes
            git commit --quiet -m "docs(closeout): fold closeout notes into NOW.md" -m "Written by ai-harness's .claude/hooks/harness-closeout.mjs --fold, run by this repository's ci.yml."
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then exit "$status"; fi
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving; the notes stay in now-notes/ for the next push to main."
          exit 1
